name: validate filters

on:
  push:
    paths:
      - 'adguard/**'
      - 'ublock/**'
      - 'scripts/validate-filters.sh'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'adguard/**'
      - 'ublock/**'
      - 'scripts/validate-filters.sh'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate filter syntax
        run: bash scripts/validate-filters.sh
